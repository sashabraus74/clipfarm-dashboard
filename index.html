:root{
  --bg:#070B16;--tx:#E8EEF9;--mut:#A9B7D3;
  --b1:#1E3A78;--b2:#2F62C9;--b3:#4F8CFF;--b4:#9CC2FF;--cy:#4FD1FF;
  --ex:#F0BE5E;--bad:#FF7F8E;--ok:#62DCA8;
  /* Glass */
  --glass:rgba(16,30,62,.40);--glass-2:rgba(18,32,68,.36);
  --glass-bd:rgba(255,255,255,.13);--hi:rgba(255,255,255,.38);
  --blur:16px;
  /* Radius system: inner = outer − padding */
  --r:20px;--pad:14px;--r-in:6px; /* 20 − 14 */
  --r-md:12px;--r-sm:8px;--r-xs:6px;--r-cell:8px;--r-pill:999px;
  --sh:0 12px 28px rgba(2,6,18,.40);
}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html{background:var(--bg);color:var(--tx);font:15px/1.45 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{min-height:100vh;background:var(--bg)}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(70% 46% at 12% -8%,rgba(79,140,255,.52),transparent 58%),
    radial-gradient(50% 36% at 98% 14%,rgba(79,209,255,.22),transparent 52%),
    radial-gradient(60% 42% at 18% 48%,rgba(79,140,255,.20),transparent 62%),
    radial-gradient(50% 36% at 88% 62%,rgba(79,209,255,.12),transparent 58%),
    radial-gradient(44% 32% at 72% 92%,rgba(47,98,201,.28),transparent 56%),
    var(--bg);
}
::selection{background:#4F8CFF55}
::placeholder{color:var(--mut)}
/* Themed scrollbar */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:#4F8CFF55;border-radius:var(--r-pill)}
*::-webkit-scrollbar-track{background:transparent}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--b4);outline-offset:2px}
/* —— Glass primitive: blur clipped to radius, 1px stroke on the curve, top-edge highlight —— */
.glass{
  --_r:var(--r);--_pad:var(--pad);
  position:relative;isolation:isolate;
  border-radius:var(--_r);padding:var(--_pad);
  background:var(--glass);
  backdrop-filter:blur(var(--blur)) saturate(155%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(155%);
  box-shadow:var(--sh),inset 0 1px 0 var(--hi);
  overflow:clip;overflow-clip-margin:0px;
  -webkit-mask-image:radial-gradient(#000 0 100%,#000 100%);
          mask-image:radial-gradient(#000 0 100%,#000 100%);
}
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  padding:1px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.10) 22%,rgba(255,255,255,.05) 70%,rgba(255,255,255,.12));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
          mask-composite:exclude;
}
/* Children sit above the stroke without escaping the clip */
.glass > *{position:relative;z-index:1}

header{max-width:560px}
header .r{display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
.upd{font-size:12px;color:var(--mut)}
.chips{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:12px}
.chips button{
  min-height:44px;padding:0 6px;font-size:13px;border-radius:var(--r-pill);
  color:var(--mut);font-weight:600;white-space:nowrap;
  background:var(--glass-2);
  backdrop-filter:blur(12px) saturate(140%);
  -webkit-backdrop-filter:blur(12px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
  border:1px solid var(--glass-bd);
  transition:background .18s,color .18s,border-color .18s,box-shadow .18s;
}
.chips button[aria-pressed=true]{
  background:var(--tx);color:var(--bg);border-color:transparent;
  box-shadow:0 6px 16px rgba(2,6,18,.35);
  backdrop-filter:none;-webkit-backdrop-filter:none;
}
.chips .sep{flex:1}
.ex{font-size:11px;font-weight:700;color:var(--ex);background:#F0BE5E22;border:1px solid #F0BE5E44;border-radius:var(--r-xs);padding:2px 6px;white-space:nowrap;vertical-align:2px}
.hero{margin-top:22px}
.hero .v{font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1}
.hero .s{color:var(--mut);font-size:14px;margin-top:6px}.hero .s b{color:var(--cy)}
.metric{display:flex;gap:6px;margin-top:16px}
.metric button{
  flex:1;min-height:44px;border-radius:calc(var(--r) - var(--pad)); /* will sit against chart? no, above it */
  font-size:13px;font-weight:600;color:var(--mut);
  background:var(--glass-2);
  backdrop-filter:blur(12px) saturate(140%);
  -webkit-backdrop-filter:blur(12px) saturate(140%);
  border:1px solid var(--glass-bd);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
}
.metric button[aria-pressed=true]{background:rgba(47,98,201,.72);color:#fff;border-color:rgba(156,194,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.chart{margin-top:10px;--_r:var(--r);--_pad:14px}
.chart.glass{padding:14px 12px 8px}
.chart svg{display:block;width:100%;height:auto;max-height:260px;overflow:visible}
.chart text{fill:var(--mut);font-size:11px;font-family:Manrope}
.chart rect.bar{cursor:pointer;transition:opacity .18s}.chart rect.bar:hover{opacity:.8}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:30px 0 12px;display:flex;align-items:center;gap:8px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div.glass{--_r:14px;--_pad:10px;padding:10px 12px}
.mini b{display:block;font-size:18px;font-weight:700}.mini span{font-size:12px;color:var(--mut);line-height:1.3;display:block}
.scale.glass{--_r:var(--r);--_pad:14px;padding:14px}
.scale .top{display:flex;justify-content:space-between;align-items:flex-start}
.scale .num{font-size:36px;font-weight:800;line-height:1}.scale .num small{font-size:15px;color:var(--mut);font-weight:600}
.track{position:relative;height:12px;border-radius:var(--r-xs);margin:22px 0 6px;background:linear-gradient(90deg,#3A2140,#2F62C9 55%,#9CC2FF);overflow:clip;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.track .mk{position:absolute;top:-6px;width:4px;height:24px;border-radius:2px;background:#fff;box-shadow:0 2px 8px #0008;transform:translateX(-2px)}
.track .acc{position:absolute;top:18px;font-size:11px;font-weight:700;transform:translateX(-50%);white-space:nowrap}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:18px}
.info{width:44px;height:44px;margin:-10px -10px 0 0;display:grid;place-items:center;color:var(--mut);border-radius:var(--r-md)}
.help{display:none;font-size:13px;color:var(--mut);margin-top:12px;
  border-radius:var(--r-in); /* 20 − 16 pad of .scale ≈ 4, but 16px pad → r-in should be 4; we use 6 as min readable inner */
  padding:12px;background:rgba(255,255,255,.06);border:1px solid var(--glass-bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.scale.glass .help{border-radius:calc(var(--_r) - var(--_pad))} /* 20 − 16 = 4px, bump via min */
.help.on{display:block}
.best{
  display:block;width:100%;text-align:left;position:relative;isolation:isolate;
  border-radius:var(--r);padding:18px;
  background:linear-gradient(150deg,rgba(47,98,201,.62),rgba(14,26,56,.62) 70%);
  backdrop-filter:blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
  box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.32);
  overflow:clip;overflow-clip-margin:0px;
  -webkit-mask-image:radial-gradient(#000 0 100%,#000 100%);
          mask-image:radial-gradient(#000 0 100%,#000 100%);
}
.best::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  padding:1px;
  background:linear-gradient(150deg,rgba(255,255,255,.46),rgba(255,255,255,.08) 40%,rgba(156,194,255,.18));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
          mask-composite:exclude;
}
.best::before{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:24px solid #ffffff14;pointer-events:none;z-index:0}
.best .k,.best .v,.best .t,.best .row,.best .go{position:relative;z-index:1}
.best .k{font-size:12px;color:#CFE0FF;font-weight:600}
.best .v{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.best .t{font-weight:700;margin-top:4px;word-break:break-word}
.best .row{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:#CFE0FF}.best .row b{color:#fff}
.best .go{display:inline-flex;gap:6px;align-items:center;margin-top:14px;background:#ffffff1f;border:1px solid #ffffff28;border-radius:var(--r-pill);padding:8px 14px;font-size:13px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
/* Calendar: panel is glass; cells are clipped tiles with a precise 8px radius (not blurred — too many layers) */
.heat.glass{--_r:var(--r);--_pad:12px;padding:12px}
.heat .cm{display:flex;align-items:center;justify-content:space-between;margin:-4px -4px 8px}.heat .cm b{font-size:14px;text-transform:capitalize}.heat .cm button{width:44px;height:44px;display:grid;place-items:center;border-radius:calc(var(--r) - 8px);color:var(--mut)}.heat .cm button:disabled{opacity:.25;cursor:default}
.heat .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.heat .h{text-align:center;font-size:11px;color:var(--mut)}
.heat .c{
  aspect-ratio:1/1.25;border-radius:var(--r-cell);
  background:rgba(255,255,255,.05);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:4px 3px;font-size:11px;line-height:1.15;color:var(--mut);text-align:left;letter-spacing:-.015em;
  position:relative;isolation:isolate;overflow:clip;overflow-clip-margin:0px;
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20);
  background-clip:padding-box;
}
.heat .c .d{font-weight:700;font-size:12px;color:var(--tx);letter-spacing:0}
.heat .c.out{opacity:.28}
.heat .c.today{box-shadow:inset 0 0 0 1.5px var(--b4),inset 0 1px 0 rgba(255,255,255,.28);border-color:transparent}
.heat [data-l="1"]{background:rgba(75,35,53,.78);border-color:rgba(255,127,142,.22)}
.heat [data-l="2"]{background:rgba(30,58,120,.78);border-color:rgba(79,140,255,.28)}
.heat [data-l="3"]{background:rgba(47,98,201,.78);border-color:rgba(156,194,255,.30)}
.heat [data-l="4"]{background:rgba(79,140,255,.82);border-color:rgba(255,255,255,.28)}
.heat button.c{color:#E8EEF9e6}
.leg{display:flex;align-items:center;gap:8px 10px;font-size:11px;color:var(--mut);margin-top:10px;flex-wrap:wrap}
.leg .li{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.leg i{width:14px;height:10px;border-radius:3px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.hbars.glass{--_r:var(--r);--_pad:6px;padding:6px;display:grid;gap:2px}
.hb{
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:calc(var(--r) - 6px); /* nested in .hbars pad 6 → 14; standalone fallback 14 */
  background:transparent;
}
.hbars:not(.glass){display:grid;gap:8px}
.hbars:not(.glass) .hb{
  border-radius:var(--r-md);background:var(--glass);
  backdrop-filter:blur(12px) saturate(140%);
  -webkit-backdrop-filter:blur(12px) saturate(140%);
  border:1px solid var(--glass-bd);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  overflow:clip;
}
button.hb:hover{background:rgba(255,255,255,.06)}
.hb .t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .n{font-size:13px;font-weight:700}
.hb .b{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:clip}
.hb .b i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--b2),var(--b4))}
.vs.glass{--_r:var(--r);--_pad:14px;padding:14px}
.vs .hd{display:grid;grid-template-columns:1fr auto 1fr;font-size:12px;font-weight:700;margin-bottom:8px}.vs .hd span:last-child{text-align:right}
.vs .r{display:grid;grid-template-columns:1fr 88px 1fr;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.vs .r .l{display:flex;justify-content:flex-end;align-items:center;gap:6px}.vs .r .rr{display:flex;align-items:center;gap:6px}
.vs .r .m{text-align:center;color:var(--mut);font-size:11px}
.vs i{height:8px;border-radius:4px;display:block}.vs .l i{background:var(--b3)}.vs .rr i{background:var(--cy)}
.dots.glass{--_r:var(--r);--_pad:14px 10px 10px;padding:14px 10px 10px}
.dots .g{display:grid;grid-template-columns:repeat(12,1fr);row-gap:10px}
.dots .c{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--mut)}
.dots .c i{border-radius:50%;background:var(--b3);display:block}.dots .c i.z{background:#22305a}
.note{font-size:12px;color:var(--mut);margin-top:8px}
p,.note,.help{text-wrap:pretty}
.alerts{display:grid;gap:8px}
.al{
  border-radius:var(--r-md);padding:12px 14px;
  background:var(--glass);
  backdrop-filter:blur(12px) saturate(140%);
  -webkit-backdrop-filter:blur(12px) saturate(140%);
  border:1px solid var(--glass-bd);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20);
  display:grid;grid-template-columns:10px 1fr;gap:10px;
  overflow:clip;
}
.al::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--ex)}.al.bad::before{background:var(--bad)}
.al b{font-size:14px}.al p{font-size:13px;color:var(--mut)}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.goal.glass{--_r:16px;--_pad:10px;padding:10px;display:grid;gap:6px}
.goal .col{height:70px;border-radius:calc(16px - 10px);background:rgba(255,255,255,.06);display:flex;align-items:flex-end;overflow:clip;border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.goal .col i{display:block;width:100%;background:linear-gradient(0deg,var(--b2),var(--b4));border-radius:inherit}
.goal b{font-size:13px}.goal span{font-size:12px;color:var(--mut);line-height:1.3}
.empty{text-align:center;padding:60px 20px;color:var(--mut);border-radius:var(--r);background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--glass-bd);box-shadow:inset 0 1px 0 var(--hi)}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
.acct.glass{--_r:var(--r-md);--_pad:12px 14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:14px}
.acct .st{font-size:12px;font-weight:700}.acct .st.on{color:var(--ok)}.acct .st.pause{color:var(--ex)}
dialog{
  border:0;padding:0;margin:0 0 0 auto;height:100%;max-height:100%;width:100%;max-width:440px;
  color:var(--tx);
  background:rgba(8,13,26,.72);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:-16px 0 40px rgba(2,6,18,.45),inset 1px 0 0 rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.20);
  border-left:1px solid transparent;
}
dialog::backdrop{background:#02061299;backdrop-filter:blur(10px) saturate(130%);-webkit-backdrop-filter:blur(10px) saturate(130%)}
dialog[open]{animation:in .26s cubic-bezier(.16,1,.3,1)}@keyframes in{from{transform:translateX(30px);opacity:.5}}
.ph{
  position:sticky;top:0;z-index:3;
  background:rgba(8,13,26,.55);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  display:flex;align-items:center;gap:4px;padding:8px;
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.08);
}
.ph button{
  width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-md);
  background:var(--glass-2);border:1px solid var(--glass-bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)
}
.ph h2{flex:1;font-size:16px;font-weight:700;margin:0;padding:0 8px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{padding:8px 16px 32px}
.stat4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat4 div{
  border-radius:var(--r-md);padding:12px;
  background:var(--glass);
  backdrop-filter:blur(12px) saturate(140%);
  -webkit-backdrop-filter:blur(12px) saturate(140%);
  border:1px solid var(--glass-bd);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20);
  overflow:clip;
}
.stat4 b{display:block;font-size:22px;font-weight:800}.stat4 span{font-size:12px;color:var(--mut)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin-top:14px;font-size:14px}.kv dt{color:var(--mut)}.kv dd{text-align:right;word-break:break-word}
.cta{display:flex;justify-content:center;align-items:center;gap:8px;min-height:50px;background:var(--tx);color:var(--bg);border-radius:var(--r-md);font-weight:800;text-decoration:none;margin-top:18px}
/* —— File d'attente —— */
.tabs{margin-top:12px}.tabs+.chips{margin-top:6px}
.qcard.glass{--_r:var(--r);--_pad:16px;padding:16px;margin-top:18px}
.qcard h3{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800}
.qcard p{font-size:14px;color:var(--mut);margin-top:8px}.qcard p b{color:var(--tx)}
.qcard label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px}
.qcard input{width:100%;min-height:48px;padding:0 14px;font:inherit;font-size:16px;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--glass-bd);border-radius:calc(var(--r) - 16px + 6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.qcard input:focus{outline:2px solid var(--b4);outline-offset:1px}
.qlink{display:inline-flex;align-items:center;gap:6px;margin-top:14px;color:var(--b4);font-weight:700;font-size:14px;text-decoration:none;min-height:44px}
.qbtn{display:flex;width:100%;justify-content:center;align-items:center;gap:8px;min-height:50px;margin-top:10px;border-radius:var(--r-md);font-weight:700;font-size:15px;background:var(--glass-2);border:1px solid var(--glass-bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.qbtn.pri{background:var(--tx);color:var(--bg);border-color:transparent}
.qbtn.bad{background:rgba(255,127,142,.14);color:var(--bad);border-color:rgba(255,127,142,.35)}
.qbtn:disabled{opacity:.38;cursor:not-allowed}
.qbtn.sm{display:inline-flex;width:auto;min-height:40px;margin:0 0 0 6px;padding:0 12px;font-size:13px;border-radius:var(--r-pill)}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;font-size:12px;flex-wrap:wrap}
.qok{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:700}
.qtoast{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);font-size:14px;background:rgba(98,220,168,.12);border:1px solid rgba(98,220,168,.35);color:var(--tx)}
.qtoast.bad,.qerr{background:rgba(255,127,142,.12);border:1px solid rgba(255,127,142,.35);color:var(--tx)}
.qerr{margin-top:12px;padding:12px 14px;border-radius:calc(var(--r) - 16px + 6px);font-size:14px}
.qkv{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut);margin-top:6px}.qkv:first-child{margin-top:0}.qkv span:last-child{color:var(--tx);text-align:right}
.qmeter{height:8px;border-radius:4px;margin:8px 0 2px;background:rgba(255,255,255,.08);overflow:clip}.qmeter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--b2),var(--cy))}
.qc{font-size:12px;font-weight:700;color:var(--mut);background:rgba(255,255,255,.08);border-radius:var(--r-pill);padding:2px 8px}
.qday{font-size:12px;font-weight:700;color:var(--mut);text-transform:capitalize;margin:14px 0 6px}
.qrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;width:100%;min-height:52px;text-align:left;padding:6px 10px 6px 6px;border-radius:calc(var(--r) - 6px)}
.qrow:hover{background:rgba(255,255,255,.06)}
.qrow+.qrow{box-shadow:0 -1px 0 rgba(255,255,255,.06)}
.qt{display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--b4)}
.qn{min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qn small{display:block;font-size:12px;font-weight:500;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.qtag{font-size:12px;font-weight:800;border-radius:var(--r-pill);padding:4px 9px;background:rgba(255,255,255,.08);color:var(--mut);border:1px solid var(--glass-bd)}
.qtag.a1{color:var(--b4);background:rgba(79,140,255,.16);border-color:rgba(79,140,255,.35)}
.qtag.a2{color:var(--cy);background:rgba(79,209,255,.14);border-color:rgba(79,209,255,.35)}
.qwarn{display:grid;grid-template-columns:18px 1fr;gap:10px;margin-top:16px;padding:12px 14px;border-radius:var(--r-md);background:rgba(240,190,94,.10);border:1px solid rgba(240,190,94,.32);color:var(--ex)}.qwarn p{font-size:13px;color:var(--tx)}

/* —— Réglages —— */
.rcard.glass{--_r:var(--r);--_pad:16px;padding:16px;margin-top:14px}
.rcard:first-child{margin-top:18px}
.rcard h3{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800}
.rcard .rlead{font-size:14px;color:var(--mut);margin-top:8px}.rcard .rlead b{color:var(--tx)}
.rkv{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut);margin-top:8px}
.rkv:first-of-type{margin-top:12px}
.rkv span:last-child{color:var(--tx);text-align:right;font-weight:600}
.rsw{width:16px;height:16px;border-radius:4px;background:var(--c,#fff);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 0 0 1px rgba(0,0,0,.35);flex:0 0 16px}
.rcolor{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px}
.rcolor .hex{margin-left:auto;color:var(--mut);font-weight:600}
.rcolor b{font-weight:600}
.rpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rpill{font-size:12px;font-weight:700;border-radius:var(--r-pill);padding:5px 10px;background:rgba(255,255,255,.08);border:1px solid var(--glass-bd);color:var(--tx)}
.racc{margin-top:12px;padding:12px;border-radius:calc(var(--r) - 16px + 6px);background:rgba(255,255,255,.05);border:1px solid var(--glass-bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.racc .rh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.racc .rh b{font-size:14px;font-weight:800}
.rst{font-size:12px;font-weight:700}
.rst.on{color:var(--ok)}
.rst.pause{color:var(--ex)}
.rst.off{color:var(--mut)}
.rcite{margin-top:10px;padding:10px 12px;border-radius:var(--r-in);background:rgba(255,255,255,.05);border:1px solid var(--glass-bd);font-size:13px;font-weight:600;line-height:1.4}
.rframe{width:72px;height:128px;border-radius:8px;overflow:clip;display:grid;grid-template-rows:1fr 1fr;flex:0 0 72px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 6px 16px rgba(2,6,18,.35);position:relative;background:#0c1630}
.rframe .rg,.rframe .rw{display:grid;place-items:center;font-size:9px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.rframe .rg{background:linear-gradient(180deg,#2F62C9,#1E3A78);color:#E8EEF9}
.rframe .rw{background:linear-gradient(180deg,#1a2848,#0c1630);color:#A9B7D3}

// Écrit un commit sur `branch` (Git Data API) en avance rapide uniquement ; 422 = la branche a bougé → relire et réappliquer.
async function commitTree(branch, edit, message) {
  for (let i = 0; ; i++) {
    const ref = await gh(`${R}/git/ref/heads/${branch}`, {ok404: 1}), head = ref && ref.object.sha;

    if (!entries) return null;
    const baseTree = head ? (await gh(`${R}/git/commits/${head}`)).tree.sha : null;
    const tree = await gh(`${R}/git/trees`, {method: 'POST', body: baseTree ? {base_tree: baseTree, tree: entries} : {tree: entries.filter(e => e.sha !== null)}});
    const c = await gh(`${R}/git/commits`, {method: 'POST', body: {message, tree: tree.sha, parents: head ? [head] : []}});
    try {
      if (head) await gh(`${R}/git/refs/heads/${branch}`, {method: 'PATCH', body: {sha: c.sha, force: false}});
      else await gh(`${R}/git/refs`, {method: 'POST', body: {ref: 'refs/heads/' + branch, sha: c.sha}});
      return c.sha;
    } catch (e) { if (![409, 422].includes(e.status) || i >= 3) throw e; }
  }
}

async function restore(path) {

    const who = [p.username && `<b>${esc(p.username)}</b>`, p.account && `compte ${esc(p.account)}`, p.channel && `${esc(p.channel)}${plat ? ' · ' + esc(plat) : ''}`].filter(Boolean).join(' · ');
    return `<div class="rpost"><div class="when">${esc(p.slot || '—')}</div>
      <div class="who">${who} · ${esc(Rst[p.status] || p.status || '')}</div>
      ${p.caption ? `<div class="cap">${esc(p.caption)}</div>` : ''}</div>`;
  }).join('');
  return `<section class="rcard glass"><h3>Prochains posts</h3>
    ${list || '<p class="rlead">Aucun post programmé dans cet instantané.</p>'}
    </section>`;
}
function Rchannels(ch) {
  const langs = (ch.language || []).map(l => Rlang[l] || l).join(', ');
  const named = (ch.named || []).map(c => {
    const extra = c.minViewers != null ? ` (min. ${n(c.minViewers)} spect.)` : '';
    return `${esc(c.displayName)} · ${esc(Rplat[c.platform] || c.platform)}${extra}`;
  });
  return `<section class="rcard glass"><h3>Chaînes</h3>
    <p class="rlead">${ch.discover ? 'Découverte automatique des lives GTA (filtre langue + seuil de spectateurs).' : 'Découverte automatique désactivée : seules les chaînes nommées sont suivies.'}</p>
    ${Rkv('Jeux', esc((ch.games || []).join(', ') || '—'))}
    ${Rkv('Langue', esc(langs || '—'))}
    ${Rkv('Spectateurs minimum', ch.minViewers != null ? n(ch.minViewers) : '—')}
    ${named.length ? `<p class="rlead" style="margin-top:12px"><b>Chaînes nommées</b></p><div class="rpills">${named.map(x => `<span class="rpill">${x}</span>`).join('')}</div>` : ''}</section>`;
}
function Rdetect(d) {
  return `<section class="rcard glass"><h3>Détection</h3>
    <p class="rlead">Pics du chat : un seau est un pic si le score et le nombre de messages passent les seuils.</p>
    ${Rkv('Score minimum', d.minScore != null ? n(d.minScore) : '—')}
    ${d.minMessages != null ? Rkv('Messages minimum', n(d.minMessages)) : ''}
    ${d.bucketSeconds != null ? Rkv('Durée d\'un seau', `${n(d.bucketSeconds)}\u00a0s`) : ''}
    ${d.medianWindowSeconds != null ? Rkv('Fenêtre médiane', `±${n(d.medianWindowSeconds / 60)}\u00a0min`) : ''}
    ${d.minGapSeconds != null ? Rkv('Écart minimum entre pics', `${n(d.minGapSeconds)}\u00a0s`) : ''}
    ${d.maxClipsPerHour != null ? Rkv('Plafond par heure', n(d.maxClipsPerHour)) : ''}
    ${d.maxClipsPerLive != null ? Rkv('Plafond par live', n(d.maxClipsPerLive)) : ''}
  </section>`;
}
function Rclips(c) {
  const fin = c.endAtSentenceBoundary ? (c.sentencePauseSeconds != null ? `à la phrase en cours (pause ≥ ${String(c.sentencePauseSeconds).replace('.', ',')}\u00a0s)` : 'à la phrase en cours') : 'durée fixe';
  const sil = c.removeSilences ? (c.silenceMinSeconds != null ? `coupés au-delà de ${String(c.silenceMinSeconds).replace('.', ',')}\u00a0s` : 'coupés') : 'conservés';
  return `<section class="rcard glass"><h3>Clips</h3>
    ${c.beforeSeconds != null ? Rkv('Début', `${n(c.beforeSeconds)}\u00a0s avant le pic`) : ''}
    ${c.minDurationSeconds != null ? Rkv('Durée minimum', `${n(c.minDurationSeconds)}\u00a0s`) : ''}
    ${c.maxDurationSeconds != null ? Rkv('Durée maximum', `${n(c.maxDurationSeconds)}\u00a0s`) : ''}
    ${Rkv('Fin', fin)}
    ${Rkv('Silences', sil)}
  </section>`;
}
function Rediting(e) {
  const colors = e.colors || {};
  const top = (e.gameplay && e.webcam && e.gameplay.y < e.webcam.y) ? 'Gameplay en haut, webcam en bas' : (e.layoutType || '');
  const cap = [e.subtitlesEnabled ? 'activés' : 'désactivés', e.positionY != null && e.height ? 'au centre de l\'écran' : '', e.wordsPerGroup != null ? `${n(e.wordsPerGroup)} mot${e.wordsPerGroup > 1 ? 's' : ''} à la fois` : ''].filter(Boolean).join(', ');
  return `<section class="rcard glass"><h3>Montage</h3>
    <div class="rmontage">
      <div class="rframe" aria-hidden="true"><div class="rg">Gameplay</div><div class="rw">Webcam</div><div class="rcap">•••</div></div>
      <div style="flex:1;min-width:0">
        ${Rkv('Format', e.width && e.height ? `${e.width}\u00a0×\u00a0${e.height}` : '—')}
        ${top ? Rkv('Disposition', top) : ''}
        ${Rkv('Sous-titres', cap || '—')}
      </div>
    </div>
    ${colors.color ? Rsw('Texte (streamer)', colors.color) : ''}
    ${colors.highlightColor ? Rsw('Mot prononcé', colors.highlightColor) : ''}
    ${colors.altHighlightColor ? Rsw('Mot prononcé (autres voix)', colors.altHighlightColor) : ''}
  </section>`;
}
function RaccStatus(a) {
  if (!a.enabled) return ['off', 'Désactivé'];
  if (a.pausedUntilRaw && D.today < a.pausedUntilRaw) return ['pause', `En pause jusqu'au ${a.pausedUntil}`];
  if (a.pausedUntil && !a.pausedUntilRaw) return ['pause', `En pause jusqu'au ${a.pausedUntil}`];
  return ['on', 'Actif'];
}
function Rpublishing(p) {
  const accs = (p.accounts || []).map(a => {
    const [cls, lab] = RaccStatus(a);
    const slots = (a.slots || []).map(Rslot);
    return `<div class="racc"><div class="rh"><b>${esc(a.key || '')} · ${esc(a.username || '')}</b><span class="rst ${cls}">${esc(lab)}</span></div>
      ${a.maxPerDay != null ? `<p class="rlead">${n(a.maxPerDay)} posts / jour</p>` : ''}
      ${slots.length ? `<div class="rpills">${slots.map(s => `<span class="rpill">${s}</span>`).join('')}</div>` : ''}</div>`;
  }).join('');
  const tags = (p.hashtags || []).join(' ');
  return `<section class="rcard glass"><h3>Publication WoopSocial</h3>
    ${p.mode ? Rkv('Mode', p.mode === 'auto' ? 'automatique' : esc(p.mode)) : ''}
    ${p.dailyCap != null ? Rkv('Plafond quotidien', `${n(p.dailyCap)} au total`) : ''}
    ${p.minGapMinutes != null ? Rkv('Écart minimum', `${n(p.minGapMinutes)}\u00a0min`) : ''}
    ${p.timezone ? Rkv('Fuseau', esc(p.timezone)) : ''}
    ${accs}
    ${p.captionTemplate ? `<p class="rlead" style="margin-top:14px"><b>Légende</b></p><div class="rcite">${esc(p.captionTemplate)}${tags ? `<br>${esc(tags)}` : ''}</div>` : ''}
  </section>`;
}
const R = {
  show() {
    const m = $('#main'), S = D.settings;
    if (!S) {
      m.innerHTML = `<div class="empty"><b>Réglages indisponibles</b>Les fichiers du pipeline n'ont pas pu être lus au dernier déploiement. L'instantané précédent sera repris dès qu'ils seront de nouveau accessibles.</div>`;
      return;
    }
    m.innerHTML = `${Rengine(S)}${Rposts(S)}${Rchannels(S.channels || {})}${Rdetect(S.detection || {})}${Rclips(S.clip || {})}${Rediting(S.editing || {})}${Rpublishing(S.publishing || {})}
      <p class="note">Instantané du ${esc(S.snapshot || D.updated)}. Ces réglages et cet état sont ceux lus lors du dernier déploiement, pas une vue en direct.</p>`;
  }
};

$('#panel').addEventListener('click', e => e.target === $('#panel') && $('#panel').close());
render();
</script>
</body>
</html>
